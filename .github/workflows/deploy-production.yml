# Deploy prosports.win when changes land on main.
# One-time setup: docs/github-actions-deploy.md

name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      hosting: ${{ steps.filter.outputs.hosting }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hosting:
              - 'index.html'
              - 'demo.html'
              - 'monitor.html'
              - 'privacy.html'
              - 'terms.html'
              - 'version.json'
              - 'js/**'
              - 'firebase.json'
              - '**/*.png'
              - '**/*.jpg'
              - '**/*.jpeg'
              - '**/*.webp'
              - '**/*.ico'
              - '**/*.svg'
              - '**/*.mp4'
              - '**/*.webm'
              - '.github/workflows/deploy-production.yml'
            functions:
              - 'functions/**'

  deploy-hosting:
    needs: changes
    if: needs.changes.outputs.hosting == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting (live)
        run: npx firebase deploy --only hosting --project pro-sports-quick-pix --non-interactive

  deploy-functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Functions
        run: npx firebase deploy --only functions --project pro-sports-quick-pix --non-interactive
